name: Foundation CI

on:
  push:
    branches:
      - main
      - agent/vmsourceconv-inspect
      - agent/foundation-hardening
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.compiler }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Upload source snapshot
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-source-${{ github.run_attempt }}
          path: |
            CMakeLists.txt
            src
            tests
          if-no-files-found: error
          retention-days: 7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVMSOURCECONV_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee "build-${{ matrix.compiler }}.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler }}-${{ github.run_attempt }}
          path: build-${{ matrix.compiler }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows:
    name: MSVC / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DVMSOURCECONV_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build-msvc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc-${{ github.run_attempt }}
          path: build-msvc.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
