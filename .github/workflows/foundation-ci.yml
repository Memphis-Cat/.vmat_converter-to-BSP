name: Foundation CI

on:
  push:
    branches:
      - main
      - agent/vmsourceconv-inspect
      - agent/foundation-hardening
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.compiler }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Upload source snapshot
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-source-${{ github.run_attempt }}
          path: |
            CMakeLists.txt
            README.md
            docs
            .github
            src
            tests
          if-no-files-found: error
          retention-days: 7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVMSOURCECONV_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee "build-${{ matrix.compiler }}.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler }}-${{ github.run_attempt }}
          path: build-${{ matrix.compiler }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows:
    name: MSVC / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DVMSOURCECONV_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build-msvc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc-${{ github.run_attempt }}
          path: build-msvc.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VMSourceCONV 0.8.0
        shell: pwsh
        run: |
          $package = "package/VMSourceCONV-0.8.0"
          New-Item -ItemType Directory -Force -Path "$package/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$package/source" | Out-Null

          Copy-Item "build/src/VMSourceCONV/Release/VMSourceCONV.exe" "$package/bin/VMSourceCONV.exe"
          Copy-Item "CMakeLists.txt" "$package/source/CMakeLists.txt"
          Copy-Item "README.md" "$package/source/README.md"
          Copy-Item "src" "$package/source/src" -Recurse
          Copy-Item "tests" "$package/source/tests" -Recurse
          Copy-Item "docs" "$package/source/docs" -Recurse
          Copy-Item ".github" "$package/source/.github" -Recurse

          @"
          VMSourceCONV 0.8.0
          Branch: agent/foundation-hardening
          Commit: ${{ github.sha }}
          CI run: ${{ github.run_id }}
          Built with: MSVC Release, warnings as errors
          Tests: VMSourceCONVFoundationTests passed
          "@ | Set-Content -Encoding UTF8 "$package/VERSION.txt"

          @"
          Command Prompt build:
            cmake -S source -B build -DBUILD_TESTING=ON
            cmake --build build --config Release
            ctest --test-dir build -C Release --output-on-failure

          Version check:
            bin\VMSourceCONV.exe --version

          Foundation map test:
            bin\VMSourceCONV.exe inspect de_cache.vmap_c --follow-references --resource-root D:\VMAT --report-vpk-collisions --foundation-de-cache.txt

          VPK verification:
            bin\VMSourceCONV.exe verify-vpk de_cache.vpk --json de-cache-vpk-verification.json --de-cache-vpk-verification.txt
          "@ | Set-Content -Encoding UTF8 "$package/QUICKSTART.txt"

          Compress-Archive -Path "$package" -DestinationPath "VMSourceCONV-0.8.0-windows-x64.zip" -CompressionLevel Optimal
      - name: Upload VMSourceCONV 0.8.0 package
        uses: actions/upload-artifact@v4
        with:
          name: VMSourceCONV-0.8.0-windows-x64
          path: VMSourceCONV-0.8.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
